  <ellipse cx="146" cy="102" rx="10" ry="14" fill="#e8c9a8"/>
  <!-- Glasses frame -->
  <rect x="62" y="96" width="34" height="26" rx="6" fill="none" stroke="#333" stroke-width="3.5"/>
  <rect x="104" y="96" width="34" height="26" rx="6" fill="none" stroke="#333" stroke-width="3.5"/>
