name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - assets/project-covers/**
      - portfolio/**
      - scripts/**
      - skills/portfolio-builder/**
      - skills/github-portfolio/**
      - package.json
      - .github/workflows/deploy-portfolio.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify portfolio
        run: |
          node --test scripts/*.test.mjs skills/portfolio-builder/scripts/*.test.mjs skills/github-portfolio/scripts/*.test.mjs
          node skills/readme-designer/scripts/validate.mjs README.md
          node scripts/sync-portfolio.mjs --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: portfolio

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
